<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Barbershop – Book Your Chair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c10; --card: #15171e; --card-hover: #1c1f28; --ink: #f0f2f5;
  --mute: #9ba1ad; --accent: #f59e0b; --accent-hover: #d97706; --on-accent: #0b0c10;
  --line: #262a35; --ok: #10b981; --bad: #ef4444; --dark: #07080a;
  --radius: 12px; --radius-sm: 8px;
}
@media (prefers-color-scheme: light) {
  :root { --bg:#f4f5f7; --card:#fff; --card-hover:#fafafa; --ink:#111827; --mute:#6b7280;
    --accent:#d97706; --accent-hover:#b45309; --on-accent:#fff; --line:#e5e7eb;
    --ok:#059669; --bad:#dc2626; --dark:#1f2937; }
}
* { box-sizing: border-box; }
html { scroll-behavior:smooth; scroll-padding-top:100px; -webkit-text-size-adjust:100%; }
::selection { background:var(--accent); color:var(--on-accent); }
body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
h1,h2,h3,.disp,button,label,.tag,.badge,.eyebrow { font-family:'Outfit',sans-serif; }
h1,h2,h3,.disp { font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:0; }
header { position:sticky; top:0; z-index:20; background:var(--dark); color:#f0f2f5; padding:14px 24px; display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between; border-bottom:2px solid var(--line); backdrop-filter:blur(12px); }
h1 { font-size:1.4rem; letter-spacing:.08em; display:flex; align-items:center; gap:10px; }
h1::before { content:""; width:8px; height:22px; background:var(--accent); border-radius:4px; }
nav { display:flex; gap:8px; flex-wrap:wrap; }
main { max-width:1000px; margin:0 auto; padding:32px 20px 48px; }
main > h2 { font-size:1.7rem; margin:48px 0 20px; display:flex; align-items:center; gap:12px; }
main > h2::before { content:""; width:6px; height:24px; background:var(--accent); border-radius:3px; }
h3 { font-size:1.15rem; }
button,input,select,textarea { font:inherit; color:var(--ink); }
button { cursor:pointer; background:var(--card); border:1px solid var(--line); padding:10px 20px; font-weight:600; font-size:.95rem; letter-spacing:.04em; border-radius:var(--radius-sm); transition:all .2s ease; }
header button { background:rgba(255,255,255,.08); color:#f0f2f5; border:1px solid transparent; }
header button.on { background:var(--accent); color:var(--on-accent); }
@media (hover:hover) {
 button:hover:not(:disabled) { background:var(--card-hover); border-color:var(--mute); transform:translateY(-1px); }
 header button:hover:not(:disabled) { background:rgba(255,255,255,.15); color:#fff; }
 button.on:hover:not(:disabled),button.p:hover:not(:disabled) { background:var(--accent-hover); color:var(--on-accent); }
}
button:active:not(:disabled) { transform:scale(.98); }
button.on,button.p { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
button.p { padding:12px 28px; font-size:1.05rem; border-radius:var(--radius); box-shadow:0 4px 14px rgba(245,158,11,.2); }
button.x { color:var(--bad); border-color:rgba(239,68,68,.3); background:rgba(239,68,68,.05); }
button.x:hover { background:rgba(239,68,68,.15); }
button:disabled { opacity:.4; cursor:not-allowed; text-decoration:line-through; transform:none!important; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input,select,textarea { width:100%; padding:12px 16px; margin:6px 0 16px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); transition:border-color .2s,box-shadow .2s; }
input:focus,select:focus,textarea:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,.15); }
#cur { width:auto; margin:0; padding:6px 12px; background:var(--dark); color:#f0f2f5; border:1px solid var(--line); border-radius:var(--radius-sm); }
label { font-size:.85rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); display:block; margin-bottom:4px; }
.c { position:relative; background:var(--card); border:1px solid var(--line); padding:24px; margin-bottom:16px; border-radius:var(--radius); transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease; box-shadow:0 2px 4px rgba(0,0,0,.02); }
.g { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; margin-bottom:12px; }
.g .c { margin:0; }
@media (hover:hover) { .pick:hover { border-color:var(--accent); transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.08); } }
.pick { cursor:pointer; }
.pick.sel { border-color:var(--accent); background:linear-gradient(135deg,rgba(245,158,11,.08),transparent 70%),var(--card); box-shadow:0 0 0 2px var(--accent); }
.pick.sel::after { content:"✓"; position:absolute; top:14px; right:16px; width:22px; height:22px; background:var(--accent); color:var(--on-accent); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:800; }
.tag { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; display:inline-block; }
.mu { color:var(--mute); font-size:.9rem; }
.st { color:var(--accent); letter-spacing:1px; font-size:.95rem; }
.mono { display:inline-flex; align-items:center; justify-content:center; width:52px; height:52px; margin-bottom:12px; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:1.3rem; border-radius:50%; }
.badge { display:inline-block; margin-left:8px; padding:2px 10px; background:rgba(245,158,11,.15); color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border-radius:20px; vertical-align:middle; }
.row { display:flex; gap:16px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.sl { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.sl button { min-width:64px; text-align:center; }
.ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
.big { font-size:1.5rem; font-family:'Outfit',sans-serif; font-weight:700; color:var(--ink); }
.hero { position:relative; color:#f0f2f5; padding:56px 40px; margin-top:8px; background:linear-gradient(135deg,#181b22,#0d0f14); border-radius:20px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.2); border:1px solid var(--line); }
.hero h2 { font-size:3.2rem; line-height:1.1; font-weight:800; letter-spacing:.02em; margin:12px 0 16px; display:block; border:0; padding:0; }
.eyebrow { display:inline-flex; align-items:center; gap:10px; font-size:.85rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); }
.eyebrow::before { content:""; width:24px; height:2px; background:var(--accent); border-radius:2px; }
.tagline { font-size:1.15rem; max-width:38ch; margin:0 0 28px; color:var(--mute); line-height:1.6; }
.facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; border-top:1px solid rgba(255,255,255,.08); padding-top:24px; margin-bottom:32px; color:#f0f2f5; }
.facts span { display:block; font-size:.75rem; font-weight:700; letter-spacing:.15em; text-transform:uppercase; color:var(--accent); margin-bottom:4px; }
.hero button { background:var(--accent); color:var(--on-accent); border-color:var(--accent); padding:14px 32px; font-size:1.05rem; border-radius:var(--radius); }
.step { display:flex; align-items:center; gap:14px; margin:36px 0 16px; }
.step i { font-style:normal; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; background:var(--accent); color:var(--on-accent); font-weight:700; font-size:1rem; border-radius:50%; }
.step.dn i { background:rgba(16,185,129,.15); color:var(--ok); }
.sum { display:flex; flex-wrap:wrap; gap:8px 32px; background:var(--card); border:1px solid var(--line); padding:18px 24px; font-size:.95rem; border-radius:var(--radius); margin-bottom:24px; box-shadow:0 4px 12px rgba(0,0,0,.03); }
.sum b { display:block; font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:2px; }
footer { max-width:1000px; margin:40px auto 0; border-top:1px solid var(--line); padding:32px 20px calc(32px + env(safe-area-inset-bottom,0px)); text-align:center; color:var(--mute); font-size:.9rem; line-height:1.8; }
footer .disp { color:var(--ink); font-size:1.1rem; }
@keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
main.in > * { animation:rise .35s cubic-bezier(.16,1,.3,1) both; }
@media (prefers-reduced-motion:reduce) { main.in > * { animation:none; } * { transition:none!important; } }
@media (max-width:520px) { h1 { font-size:1.2rem; } .hero { padding:36px 20px; } .hero h2 { font-size:2.2rem; } .g { grid-template-columns:1fr; } }
.ph { display:block; width:56px; height:56px; object-fit:cover; margin-bottom:12px; border-radius:50%; border:2px solid var(--accent); }
.up { display:inline-block; cursor:pointer; background:var(--card); color:var(--ink); border:1px solid var(--line); padding:8px 16px; font-weight:600; font-size:.9rem; border-radius:var(--radius-sm); transition:all .2s; }
.up:hover { background:var(--card-hover); border-color:var(--mute); }
.feat { grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
.hero.cv { background-size:cover; background-position:center; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:24px; }
.stats > div { background:var(--card); padding:20px 16px; text-align:center; border:1px solid var(--line); border-radius:var(--radius); box-shadow:0 2px 6px rgba(0,0,0,.02); }
.stats b { display:block; font-family:'Outfit',sans-serif; font-size:2.2rem; line-height:1; color:var(--accent); font-weight:800; margin-bottom:4px; }
.stats span { font-family:'Outfit',sans-serif; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
.tick { overflow:hidden; white-space:nowrap; background:var(--dark); color:#f0f2f5; margin:28px 0; border-radius:var(--radius-sm); border:1px solid var(--line); }
.trk { display:inline-flex; padding:12px 0; animation:mq 30s linear infinite; }
.trk span { display:inline-flex; align-items:center; gap:32px; padding-right:32px; font-family:'Outfit',sans-serif; font-size:1rem; letter-spacing:.15em; text-transform:uppercase; color:var(--mute); }
.trk span::after { content:"•"; color:var(--accent); font-size:1.2rem; }
@keyframes mq { to { transform:translateX(-50%); } }
.num { font-family:'Outfit',sans-serif; font-size:2.8rem; line-height:1; font-weight:800; color:var(--line); transition:color .2s; margin-bottom:8px; }
@media (hover:hover) { .c:hover { border-color:var(--mute); box-shadow:0 8px 24px rgba(0,0,0,.05); } .feat .c:hover .num { color:var(--accent); } }
.ribbon { position:absolute; top:-12px; right:20px; background:var(--accent); color:var(--on-accent); font-family:'Outfit',sans-serif; font-weight:700; font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; padding:4px 12px; border-radius:20px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
.fab { position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:15; box-shadow:0 8px 24px rgba(0,0,0,.3); }
@media (min-width:700px) { .fab { display:none!important; } }
main.in > *:nth-child(2) { animation-delay:.04s; } main.in > *:nth-child(3) { animation-delay:.08s; }
main.in > *:nth-child(4) { animation-delay:.12s; } main.in > *:nth-child(5) { animation-delay:.16s; }
@media (prefers-reduced-motion:reduce) { .trk { animation:none; } }
</style>
</head>
<body>
<header><h1 id="brand">Barbershop</h1><nav id="nav"></nav><select id="cur" aria-label="Currency" onchange="cur=this.value;draw()"></select></header>
<main id="app"></main><footer id="foot"></footer><button id="fab" class="p fab" onclick="go('book')">Book a Chair</button>
<script>
const KEY='barbershop_v3';
const $=i=>document.getElementById(i), val=i=>$(i).value;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let a=5381,b=52711;for(const ch of 'bs|'+s){const k=ch.charCodeAt(0);a=(a*33^k)>>>0;b=(b*31+k)>>>0}return a.toString(36)+b.toString(36)};
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function seed(){return{info:{name:'Habesha Cuts',phone:'+251 900 000 000',addr:'Adama, Ethiopia',hours:'Mon–Sat, 09:00–18:00'},pw:hash('admin123'),barbers:[{id:1,name:'Abel',spec:'Fades and beards',r:[5,4,5]},{id:2,name:'Dawit',spec:'Classic cuts',r:[4,4]},{id:3,name:'Samson',spec:'Kids and styling',r:[]}],packages:[{id:1,name:'Haircut',price:150,desc:'Wash and precise cut'},{id:2,name:'Cut + Beard',price:250,desc:'Haircut and detailed beard trim'},{id:3,name:'Full Care',price:400,desc:'Cut, beard trim, facial and relaxing massage'}],styles:[{id:1,name:'Low Fade'},{id:2,name:'Afro Shape-up'},{id:3,name:'Buzz Cut'},{id:4,name:'Taper'},{id:5,name:'Beard Design'},{id:6,name:'Kids Cut'}],posts:[{id:1,t:'Welcome to Our New Space',d:'Book your chair online easily and skip the waiting line.',date:ymd(new Date())}],bookings:[],rated:{},rates:{USD:.0065,EUR:.006,GBP:.005,AED:.024,SAR:.024,KES:.84}}}
let S=null; try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){} if(!S||!S.info)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}};
let view='home',cur='ETB',authed=false,otab='bookings',B={},done=null,note='';
const SLOTS=['09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'];
const avg=b=>b.r.length?b.r.reduce((a,c)=>a+c,0)/b.r.length:0;
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
const conv=n=>cur==='ETB'?'':'≈ '+(n*(S.rates[cur]||0)).toFixed(2)+' '+cur;
const rating=b=>b.r.length?`${avg(b).toFixed(1)} · ${b.r.length} rating${b.r.length>1?'s':''}`:'New Member';
const ranked=()=>S.barbers.slice().sort((a,b)=>avg(b)-avg(a)||b.r.length-a.r.length);
const av=(b,f)=>b.photo&&b.photo.startsWith('data:image/')?`<img class="ph" alt="${esc(b.name)}" src="${b.photo}"${f?' style="margin:0"':''}>`:`<span class="mono"${f?' style="margin:0"':''}>${esc(b.name[0]||'')}</span>`;
function go(v){view=v;done=null;note='';draw();scrollTo(0,0);const a=$('app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in')}
function draw(){$('brand').textContent=S.info.name;$('cur').innerHTML=['ETB',...Object.keys(S.rates)].map(c=>`<option${c==cur?' selected':''}>${c}</option>`).join('');$('nav').innerHTML=[['home','Home'],['book','Book'],['barbers','Barbers'],['owner','Owner']].map(([k,l])=>`<button class="${view==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');$('fab').style.display=(view=='home'||view=='barbers')?'':'none';$('app').innerHTML=({home,book,barbers,owner})[view]();$('foot').innerHTML='<b class="disp">'+esc(S.info.name)+'</b><br>'+esc(S.info.addr)+' · '+esc(S.info.hours)+' · '+esc(S.info.phone)+'<br><span class="mu">All prices charged in Ethiopian Birr (Br)</span>'}
function home(){const AR=S.barbers.reduce((a,b)=>a.concat(b.r),[]),tk=S.styles.map(x=>`<span>${esc(x.name)}</span>`).join('');return`<div class="hero${S.info.cover?' cv':''}"${S.info.cover&&S.info.cover.startsWith('data:image/')?` style="background-image:linear-gradient(135deg,rgba(7,8,10,.92),rgba(7,8,10,.6)),url(${S.info.cover})"`:''}><div class="eyebrow">Professional Grooming Services</div><h2>${esc(S.info.name)}</h2><p class="tagline">Walk in tired, walk out sharp. Choose your trusted barber and reserve your chair instantly.</p><div class="facts"><div><span>Location</span>${esc(S.info.addr)}</div><div><span>Working Hours</span>${esc(S.info.hours)}</div><div><span>Phone Line</span>${esc(S.info.phone)}</div></div><button onclick="go('book')">Book a Chair</button></div><div class="stats"><div><b>${S.barbers.length}</b><span>Expert Barbers</span></div><div><b>${S.styles.length}</b><span>Hair Styles</span></div><div><b>${S.packages.length}</b><span>Care Packages</span></div><div><b>${AR.length?(AR.reduce((a,c)=>a+c,0)/AR.length).toFixed(1):'New'}</b><span>Avg Rating</span></div></div>${tk?`<div class="tick" aria-hidden="true"><div class="trk">${tk}${tk}</div></div>`:''}<div class="g feat"><div class="c"><div class="num">01</div><h3>Skilled Barbers</h3><p class="mu" style="margin:6px 0 0">Select the stylist you prefer, backed by verified client reviews.</p></div><div class="c"><div class="num">02</div><h3>Zero Wait Time</h3><p class="mu" style="margin:6px 0 0">Book your precise day and time slot ahead of schedule.</p></div><div class="c"><div class="num">03</div><h3>Flexible Payments</h3><p class="mu" style="margin:6px 0 0">Pay seamlessly via Telebirr, CBE Birr, or cash at the shop counter.</p></div></div><h2>Shop News & Updates</h2>${S.posts.slice().reverse().map(p=>`<div class="c"><h3>${esc(p.t)}</h3><div class="mu" style="margin-bottom:6px">${esc(p.date)}</div><p style="margin:0">${esc(p.d)}</p></div>`).join('')||'<p class="mu">No news published yet.</p>'}<h2>Top Rated Barbers</h2><div class="g">${ranked().slice(0,3).map(b=>`<div class="c" style="text-align:center">${av(b)}<div class="tag">Chair ${S.barbers.indexOf(b)+1}</div><h3 style="margin:4px 0">${esc(b.name)}</h3><div class="st" style="margin-bottom:4px">${stars(avg(b))}</div><div class="mu">${rating(b)}</div></div>`).join('')}</div>`}
function barbers(){return`<h2>Our Barbers</h2><p class="mu" style="margin-top:-10px;margin-bottom:24px">Ranked by client satisfaction. Tap a star to rate your experience.</p>`+ranked().map(b=>`<div class="c"><div class="row"><div style="display:flex;gap:16px;align-items:center">${av(b,1)}<div><div class="tag">Chair ${S.barbers.indexOf(b)+1}</div><h3 style="margin:2px 0">${esc(b.name)} ${b===ranked()[0]&&b.r.length?'<span class="badge">Top Rated</span>':''}</h3><div class="mu" style="margin-bottom:4px">${esc(b.spec)}</div><div class="st">${stars(avg(b))} <span class="mu" style="letter-spacing:0;margin-left:6px">${rating(b)}</span></div></div></div><button class="p" onclick="B.barber=${b.id};B.time='';go('book')">Select</button></div><div class="sl" style="margin:14px 0 0;align-items:center"><span class="mu" style="font-size:.85rem">Rate Barber:</span>${[1,2,3,4,5].map(n=>`<button class="${S.rated[b.id]==n?'on':''}" aria-label="${n} stars" onclick="rate(${b.id},${n})">${n} ★</button>`).join('')}</div></div>`).join('')+`<p class="ok">${esc(note)}</p>`}
function rate(id,n){const b=S.barbers.find(x=>x.id==id),p=S.rated[id];if(p){const i=b.r.indexOf(p);if(i>-1)b.r.splice(i,1)}b.r.push(n);S.rated[id]=n;save();note='Thank you! Your rating for '+b.name+' has been saved.';draw()}
const taken=(bid,d,t)=>S.bookings.some(x=>x.barber==bid&&x.date==d&&x.time==t&&x.status!='Cancelled');
function pick(k,v){B[k]=v;if(k=='barber')B.time='';draw()}
function book(){if(done)return`<div class="c" style="text-align:center;padding:40px 24px"><div class="mono" style="margin:0 auto 16px;width:64px;height:64px;font-size:2rem">✓</div><h2 class="ok" style="margin-bottom:8px">Booking Confirmed</h2><p class="mu">Your reservation code is</p><p><b class="disp big" style="font-size:2.2rem;letter-spacing:2px">${done.code}</b></p><div class="sum" style="text-align:left;max-width:400px;margin:24px auto"><p style="margin:0"><b>Client</b>${esc(done.name)} (${esc(done.phone)})</p><p style="margin:8px 0 0"><b>Schedule</b>${done.date} at ${done.time}</p><p style="margin:8px 0 0"><b>Barber & Style</b>${esc(done.bn)} · ${esc(done.sn)} (${esc(done.pn)})</p><p style="margin:8px 0 0"><b>Payment</b>${esc(done.pay)} · <b>${done.price} Br</b> ${conv(done.price)}</p></div><p class="mu">Please present your code when arriving at the shop.</p><button class="p" onclick="B={};done=null;draw()">Make Another Booking</button></div>`;const bar=S.barbers.find(b=>b.id==B.barber),pk=S.packages.find(p=>p.id==B.pkg),st=S.styles.find(x=>x.id==B.style),sel=(k,v)=>B[k]==v?' sel':'';const now=new Date(),today=B.date==ymd(now);return`<h2>Book a Chair</h2><div class="sum"><span><b>Style</b>${st?esc(st.name):'—'}</span><span><b>Barber</b>${bar?esc(bar.name):'—'}</span><span><b>Package</b>${pk?esc(pk.name):'—'}</span><span><b>Schedule</b>${B.date&&B.time?B.date+' @ '+B.time:'—'}</span><span><b>Total</b>${pk?pk.price+' Br':'—'}</span></div><div class="step${B.style?' dn':''}"><i>1</i><h3>Choose a Hairstyle</h3></div><div class="g">${S.styles.map((s,i)=>`<div class="c pick${sel('style',s.id)}" onclick="pick('style',${s.id})"><div class="tag">Style 0${i+1}</div><h3 style="margin:0">${esc(s.name)}</h3></div>`).join('')}</div><div class="step${B.barber?' dn':''}"><i>2</i><h3>Choose a Barber</h3></div><div class="g">${S.barbers.map((b,i)=>`<div class="c pick${sel('barber',b.id)}" onclick="pick('barber',${b.id})">${av(b)}<div class="tag">Chair 0${i+1}</div><h3 style="margin:2px 0">${esc(b.name)}</h3><div class="st">${stars(avg(b))}</div><div class="mu">${rating(b)}</div></div>`).join('')}</div><div class="step${B.pkg?' dn':''}"><i>3</i><h3>Choose a Package</h3></div><div class="g">${S.packages.map((p,i)=>`<div class="c pick${sel('pkg',p.id)}" onclick="pick('pkg',${p.id})">${i==1&&S.packages.length>2?'<span class="ribbon">Popular</span>':''}<h3 style="margin:0 0 6px">${esc(p.name)}</h3><div class="disp big" style="font-size:1.6rem;margin-bottom:4px">${p.price} Br</div><div class="mu" style="margin-bottom:6px">${conv(p.price)}</div><div class="mu" style="font-size:.85rem">${esc(p.desc)}</div></div>`).join('')}</div><div class="step${B.time?' dn':''}"><i>4</i><h3>Pick Date & Time</h3></div><label for="dt">Reservation Date</label><input id="dt" type="date" min="${ymd(now)}" value="${B.date||''}" onchange="B.date=this.value;B.time='';draw()"><div class="sl">${SLOTS.map(t=>{const off=!bar||!B.date||taken(B.barber,B.date,t)||(today&&parseInt(t)<=now.getHours());return`<button class="${B.time==t?'on':''}" ${off?'disabled':''} onclick="pick('time','${t}')">${t}</button>`}).join('')}</div>${!bar||!B.date?'<p class="mu">Select a barber and date to view available appointment times. Booked slots appear disabled.</p>':''}<div class="step${(B.name||'').trim()&&B.phone?' dn':''}"><i>5</i><h3>Your Contact & Payment</h3></div><label for="nm">Full Name</label><input id="nm" value="${esc(B.name||'')}" oninput="B.name=this.value" autocomplete="name" placeholder="e.g. Samuel Kebede"><label for="ph">Phone Number</label><input id="ph" value="${esc(B.phone||'')}" oninput="B.phone=this.value" inputmode="tel" autocomplete="tel" placeholder="e.g. +251 911..."><label for="py">Payment Method</label><select id="py" onchange="B.pay=this.value">${['Telebirr','CBE Birr','Cash at shop'].map(m=>`<option${B.pay==m?' selected':''}>${m}</option>`).join('')}</select><div style="margin:20px 0;display:flex;align-items:center;justify-content:space-between"><span>Total Amount:</span><span class="big">${pk?pk.price+' Br':'—'} <span class="mu" style="font-weight:normal;font-size:.9rem">${pk?conv(pk.price):''}</span></span></div><button class="p" style="width:100%" onclick="confirmBooking()">Confirm Reservation</button><p class="bad" style="margin-top:10px">${esc(note)}</p>`}
function confirmBooking(){const s=S.styles.find(x=>x.id==B.style),b=S.barbers.find(x=>x.id==B.barber),p=S.packages.find(x=>x.id==B.pkg);if(!s||!b||!p||!B.date||!B.time){note='Please complete steps 1 through 4 before confirming.';return draw()}if(!(B.name||'').trim()||(B.phone||'').replace(/\D/g,'').length<7){note='Please enter your name and a valid phone number.';return draw()}if(taken(b.id,B.date,B.time)){note='Selected time slot was just booked by another client. Please choose another.';B.time='';return draw()}done={code:'BS'+Math.random().toString(36).slice(2,6).toUpperCase()+Date.now().toString(36).slice(-3).toUpperCase(),name:B.name.trim(),phone:B.phone.trim(),barber:b.id,bn:b.name,sn:s.name,pn:p.name,price:p.price,date:B.date,time:B.time,pay:B.pay||'Telebirr',status:'Booked'};S.bookings.push(done);save();note='';B={};draw();scrollTo(0,0)}
function owner(){if(!authed)return`<div class="c" style="max-width:400px;margin:40px auto"><h2>Owner Portal</h2><p class="mu" style="margin-bottom:20px">Enter your password to manage the shop database.</p><label for="lp">Password</label><input id="lp" type="password" onkeydown="if(event.key=='Enter')login()"><button class="p" style="width:100%" onclick="login()">Log In</button><p class="bad" style="margin-top:10px">${esc(note)}</p><p class="mu" style="margin-top:16px;font-size:.8rem">Default password: admin123</p></div>`;const tabs=[['bookings','Bookings'],['barbers','Barbers'],['packages','Packages'],['styles','Styles'],['news','News'],['settings','Settings']];let h=`<div class="row"><h2>Management Panel</h2><button onclick="authed=false;note='';draw()">Log Out</button></div><div class="sl" style="margin-top:20px">${tabs.map(([k,l])=>`<button class="${otab==k?'on':''}" onclick="otab='${k}';note='';draw()">${l}</button>`).join('')}</div>`;const rm=(k,id)=>`<button class="x" onclick="del('${k}',${id})">Remove</button>`;if(otab=='bookings'){const list=S.bookings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));h+=`<div class="c" style="display:flex;justify-content:space-between;align-items:center"><span>Total Active Earnings</span><span class="big">${S.bookings.filter(b=>b.status!='Cancelled').reduce((a,b)=>a+b.price,0)} Br</span></div>`+(list.map(b=>`<div class="c"><div class="row"><div><h3 style="margin:0 0 4px">${esc(b.name)} <span class="mu" style="font-weight:normal;font-size:.9rem">(${esc(b.phone)})</span></h3><div class="mu">${b.date} @ ${b.time} · <b>${esc(b.bn)}</b> · ${esc(b.sn)} · ${esc(b.pn)}</div><div class="mu" style="margin-top:4px">${b.code} · ${b.price} Br · ${esc(b.pay)} · <span class="${b.status=='Cancelled'?'bad':b.status=='Done'?'ok':''}">${b.status}</span></div></div><div class="sl" style="margin:0"><button onclick="setStatus('${b.code}','Done')">Complete</button><button class="x" onclick="setStatus('${b.code}','Cancelled')">Cancel</button></div></div></div>`).join('')||'<p class="mu">No bookings registered yet.</p>')}if(otab=='barbers')h+=S.barbers.map(b=>`<div class="c row"><span style="display:flex;gap:16px;align-items:center">${av(b,1)}<span><h3 style="margin:0 0 2px">${esc(b.name)}</h3><div class="mu">${esc(b.spec)} · ${rating(b)}</div></span></span><span class="sl" style="margin:0"><label class="up">Photo<input type="file" accept="image/*" hidden onchange="photo('b',${b.id},this.files[0])"></label>${b.photo?`<button onclick="rmPhoto('b',${b.id})">Clear</button>`:''}${rm('barbers',b.id)}</span></div>`).join('')+`<div class="c"><h3>Add New Barber</h3><label>Name</label><input id="f1" placeholder="Barber name"><label>Speciality</label><input id="f2" placeholder="e.g. Fades, Beards"><button class="p" onclick="add('barbers',{name:val('f1').trim(),spec:val('f2').trim(),r:[]})">Add Barber</button></div>`;if(otab=='packages')h+=S.packages.map(p=>`<div class="c row"><span><h3 style="margin:0 0 2px">${esc(p.name)}</h3><div class="big" style="font-size:1.2rem;margin-bottom:2px">${p.price} Br</div><span class="mu">${esc(p.desc)}</span></span>${rm('packages',p.id)}</div>`).join('')+`<div class="c"><h3>Add Package</h3><label>Name</label><input id="f1"><label>Price in Birr</label><input id="f2" type="number" min="0"><label>Description</label><input id="f3"><button class="p" onclick="add('packages',{name:val('f1').trim(),price:Math.max(0,+val('f2')||0),desc:val('f3').trim()})">Add Package</button></div>`;if(otab=='styles')h+=S.styles.map((s,i)=>`<div class="c row"><span><span class="tag">Style 0${i+1}</span> <h3 style="margin:2px 0 0">${esc(s.name)}</h3></span>${rm('styles',s.id)}</div>`).join('')+`<div class="c"><h3>Add Hairstyle</h3><label>Style Name</label><input id="f1"><button class="p" onclick="add('styles',{name:val('f1').trim()})">Add Style</button></div>`;if(otab=='news')h+=S.posts.slice().reverse().map(p=>`<div class="c row"><span><h3 style="margin:0 0 4px">${esc(p.t)}</h3><p style="margin:0" class="mu">${esc(p.d)}</p></span>${rm('posts',p.id)}</div>`).join('')+`<div class="c"><h3>Publish News Update</h3><label>Title</label><input id="f1"><label>Message</label><textarea id="f2" rows="3"></textarea><button class="p" onclick="add('posts',{t:val('f1').trim(),name:val('f1').trim(),d:val('f2').trim(),date:ymd(new Date())})">Publish Post</button></div>`;if(otab=='settings')h+=`<div class="c"><h3>Hero Banner Photo</h3><p class="mu" style="margin-bottom:12px">Upload a clean, wide photo of your barbershop interior.</p><div class="sl"><label class="up">Upload Banner<input type="file" accept="image/*" hidden onchange="photo('c',0,this.files[0])"></label>${S.info.cover?`<button onclick="rmPhoto('c',0)">Remove Photo</button>`:''}</div></div><div class="c"><h3>Shop Information</h3>${[['name','Shop Name'],['phone','Phone Number'],['addr','Address'],['hours','Opening Hours']].map(([k,l])=>`<label>${l}</label><input id="i_${k}" value="${esc(S.info[k])}">`).join('')}<button class="p" onclick="saveInfo()">Save Info</button></div><div class="c"><h3>Currency Exchange Rates (1 Birr =)</h3>${Object.keys(S.rates).map(k=>`<label>${k}</label><input id="r_${k}" type="number" step="any" min="0" value="${S.rates[k]}">`).join('')}<button class="p" onclick="saveRates()">Save Rates</button></div><div class="c"><h3>Change Password</h3><label>Current Password</label><input id="p0" type="password"><label>New Password (6+ characters)</label><input id="p1" type="password"><button class="p" onclick="changePw()">Update Password</button></div><div class="c"><h3>Danger Zone</h3><p class="mu" style="margin-bottom:12px">Clear all custom settings and restore initial demo data.</p><button class="x" onclick="resetAll()">Reset All Data</button></div>`;return h+`<p class="ok" style="margin-top:12px">${esc(note)}</p>`}
function login(){if(hash(val('lp'))==S.pw){authed=true;note=''}else note='Incorrect password.';draw()}
function setStatus(c,s){S.bookings.find(b=>b.code==c).status=s;save();draw()}
function add(k,o){if(!(o.name||o.t)){note='Please provide a valid name or title.';return draw()}o.id=uid();S[k].push(o);save();note='Item added successfully.';draw()}
function del(k,id){if(confirm('Are you sure you want to remove this item?')){S[k]=S[k].filter(x=>x.id!=id);save();draw()}}
function saveInfo(){['name','phone','addr','hours'].forEach(k=>{const v=val('i_'+k).trim();if(v)S.info[k]=v});save();note='Shop information updated successfully.';draw()}
function saveRates(){Object.keys(S.rates).forEach(k=>{const v=+val('r_'+k);if(v>0)S.rates[k]=v});save();note='Exchange rates updated successfully.';draw()}
function changePw(){const n=val('p1');if(hash(val('p0'))!=S.pw)note='Current password is incorrect.';else if(n.length<6)note='New password must be at least 6 characters long.';else{S.pw=hash(n);save();note='Password updated successfully.'}draw()}
function photo(kind,id,f){if(!f||!/^image\//.test(f.type))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const cv=document.createElement('canvas'),x=cv.getContext('2d');if(kind=='b'){const m=Math.min(im.width,im.height);cv.width=cv.height=240;x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,240,240)}else if(kind=='s'){const w=Math.min(im.width,im.height*4/3),h=w*3/4;cv.width=480;cv.height=360;x.drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,0,0,480,360)}else{const k=Math.min(1,1200/im.width);cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);x.drawImage(im,0,0,cv.width,cv.height)}const url=cv.toDataURL('image/jpeg',.85);if(kind=='b')S.barbers.find(b=>b.id==id).photo=url;else if(kind=='s')S.styles.find(b=>b.id==id).photo=url;else S.info.cover=url;save();note='Photo uploaded successfully.';draw()};im.src=r.result};r.readAsDataURL(f)}
function rmPhoto(kind,id){if(kind=='b')delete S.barbers.find(b=>b.id==id).photo;else if(kind=='s')delete S.styles.find(b=>b.id==id).photo;else delete S.info.cover;save();note='Photo removed.';draw()}
function resetAll(){if(confirm('Reset all website data back to default?')){S=seed();save();authed=false;view='home';B={};draw()}}
draw();$('app').classList.add('in');
</script>
</body>
</html>
